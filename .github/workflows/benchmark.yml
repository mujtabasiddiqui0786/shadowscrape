name: Weekly detector benchmark

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[stealth]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m patchright install chromium
      - name: Run headful under Xvfb (strongest mode)
        run: xvfb-run -a python -m benchmarks.detectors --engines playwright stealthy --repeat 3 --headful
      - uses: actions/upload-artifact@v4
        with:
          name: detector-benchmark
          path: benchmarks/results/latest.*
