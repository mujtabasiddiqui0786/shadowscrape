[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowscrape"
version = "0.1.0"
description = "Web scraping framework: fast HTTP with TLS impersonation, stealth browsers, adaptive parsing, concurrent crawling."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mujtaba Siddiqui" }]
keywords = ["web scraping", "crawler", "playwright", "tls fingerprint", "mcp", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = ["lxml", "cssselect", "curl_cffi"]

[project.optional-dependencies]
browser = ["playwright"]
stealth = ["playwright", "patchright"]
mcp = ["mcp"]
shell = ["ipython"]
all = ["playwright", "patchright", "mcp", "ipython"]

[project.urls]
Homepage = "https://github.com/mujtabasiddiqui0786/shadowscrape"
Issues = "https://github.com/mujtabasiddiqui0786/shadowscrape/issues"

[project.scripts]
shadowscrape = "shadowscrape.cli:main"

[tool.setuptools.packages.find]
include = ["shadowscrape*"]

[tool.pytest.ini_options]
markers = ["browser: needs an installed chromium"]
