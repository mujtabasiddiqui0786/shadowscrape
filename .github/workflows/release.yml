name: Release

# Publishes to PyPI when a GitHub release is published.
# One-time setup before this works: create the project on PyPI and add this repo
# as a "trusted publisher" (https://docs.pypi.org/trusted-publishers/). No token is stored here.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
